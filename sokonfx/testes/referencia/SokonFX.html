label><label class="smoke-setting" hidden>Separação nas pontas <output id="tipGapValue">48 px</output><input id="tipGap" type="range" min="0" max="120" value="48"></label><label class="smoke-setting" hidden>Altura da junção <output id="joinAtValue">100%</output><input id="joinAt" type="range" min="10" max="100" value="100"></label><label class="smoke-setting" hidden>Expansão para cima <output id="riseValue">100%</output><input id="rise" type="range" min="0" max="200" value="100"></label><label class="smoke-setting" hidden>Expansão para baixo <output id="fallValue">0%</output><input id="fall" type="range" min="0" max="200" value="0"></label><label class="smoke-setting" hidden>Espelhamento horizontal<select id="smokeMirror"><option value="off">Desligado</option><option value="flip">Inverter conjunto</option><option value="pairs">Espelhar em pares</option></select></label><label>Estilo · Vetor → Cel shading<input id="styleMix" type="range" min="0" max="100" value="0"></label><label>Cor da energia<input id="tint" type="color" value="#ff781a"></label><label>Intensidade<input id="power" type="range" min="3" max="14" value="9"></label><label>Partículas<input id="particles" type="range" min="0" max="60" value="32"></label><label>Luminosidade<input id="light" type="range" min="0" max="100" value="75"></label><label class="impact-setting">Desenho do efeito<select id="drawing" style="grid-column:1/-1"><option value="star">Estrela clássica</option><option value="cross">Clarão em cruz</option><option value="saw">Serra giratória</option><option value="twin">Pontas duplas</option></select></label><label class="impact-setting">Movimento do efeito<select id="motion" style="grid-column:1/-1"><option value="pulse">Abre e fecha</option><option value="out">Abre para fora</option><option value="in">De fora para dentro</option></select></label><label class="opening-setting" hidden>Início da abertura · quadro <output id="openingValue">7</output><input id="openingFrame" type="range" min="1" max="14" value="7"></label><label class="opening-setting" hidden>Fragmentos do miolo <output id="pieceValue">52</output><input id="pieces" type="range" min="0" max="120" value="52"></label><label class="opening-setting" hidden>Forma da abertura<select id="openingShape"><option value="radial">Radial</option><option value="cross">Em cruz</option><option value="fan">Em leque</option><option value="spiral">Em espiral</option><option value="random">Aleatório</option></select></label><label class="impact-setting">Miolo · largura da camada externa<output id="rimWidthValue">100%</output><input id="rimWidth" type="range" min="10" max="250" value="100"></label><label class="impact-setting">Miolo · largura da camada clara<output id="coreWidthValue">100%</output><input id="coreWidth" type="range" min="10" max="250" value="100"></label><label class="impact-setting">Grossura dos riscos internos<output id="riskWidthValue">100%</output><input id="riskWidth" type="range" min="5" max="1000" value="100"></label><label class="impact-setting">Grossura dos riscos externos<output id="outerWidthValue">100%</output><input id="outerWidth" type="range" min="25" max="250" value="100"></label><label class="impact-setting">Cor das partículas<input id="particleTint" type="color" value="#ff781a"></label><label class="impact-setting">Usar cor da energia<input id="linkTint" type="checkbox" checked style="grid-column:2;width:auto"></label><label class="impact-setting">Grossura das partículas<output id="particleWidthValue">100%</output><input id="particleWidth" type="range" min="25" max="300" value="100"></label><label class="impact-setting">Tipos de partículas<output id="shapesValue">1</output><input id="shapes" type="range" min="1" max="4" value="1"></label><button type="button" class="impact-setting" id="halo" aria-pressed="true">Halo de fundo · ligado</button><label class="impact-setting">Diâmetro da expansão <output id="diameterValue">100%</output><input id="diameter" type="range" min="10" max="200" value="100"></label><label class="impact-setting">Direcional <output id="focusValue">0%</output><input id="focus" type="range" min="0" max="100" value="0"></label><label>Direção<input id="angle" type="range" min="-180" max="180" value="-15"></label><label>Velocidade<select id="fps"><option>12</option><option selected>24</option><option>30</option><option>60</option></select></label><button class="primary" id="generate">Gerar variação</button><label>Nome do tipo<input id="presetName" maxlength="60" placeholder="Ex.: Impacto pesado"></label><button id="keep">Salvar tipo</button><button id="backup">Baixar todos os tipos</button><label>Importar tipos (.json)<input id="restore" type="file" accept=".json,application/json"></label><label>Tipos salvos<select id="savedTypes"><option value="">Escolher tipo</option></select></label><output id="presetStatus" role="status"></output><button id="save">Exportar spritesheet PNG</button></aside></section></main>
<script>
const el=id=>document.getElementById(id);
const stage=el('stage'), frames=16;
let seed=75823,playing=true,start=performance.now();
function generator(value){return ()=>{value=(Math.imul(value,1664525)+1013904223)>>>0;return value/4294967296}}
const profiles = {
 Impacto: {rimWidth:100,coreWidth:100,diameter:100, focus:0, riskWidth:100, outerWidth:100, particleWidth:100, shapes:1, styleMix:0, particles:32, light:75},
 Corte: {styleMix:0, particles:18, light:55},
 Projétil: {styleMix:0, particles:38, light:80},
 Fogo: {tint:'#ff651e',styleMix:60,particles:22,light:75},
 Água: {tint:'#229fde',styleMix:55,particles:32,light:35},
 'Pressão de ar': {tint:'#b8e8fa',styleMix:35,particles:12,light:18},
 'Ponto de luz': {tint:'#ffc96a',styleMix:30,particles:18,light:85},
 Fumaça: {tint:'#9699a4',styleMix:65,particles:16,light:0},
 Gosma: {tint:'#83c533',styleMix:70,particles:12,light:25}
};
function lighting(ctx,kind,t,color,amount){
 if(!amount)return;
 ctx.save();
 let x=0,y=0,rx=150,ry=150,pulse=Math.exp(-3*t);
 if(kind==='Corte'){
  x=-95+210*t; y=35-77*t; rx=116; ry=19;
  pulse=.5+.5*Math.sin(Math.PI*t);
 }else if(kind==='Projétil'){
  x=-50+110*t; rx=97; ry=68; pulse=.88+.12*Math.cos(t*12);
 }
 ctx.translate(x,y);
 if(kind==='Corte')ctx.rotate(-.42);
 ctx.scale(rx,ry);
 ctx.globalAlpha*=amount/100*pulse;
 const glow=ctx.createRadialGradient(0,0,0,0,0,1);
 glow.addColorStop(0,'#fff8e9');glow.addColorStop(.23,color);
 glow.addColorStop(.57,color+'85');glow.addColorStop(1,color+'00');
 ctx.fillStyle=glow;ctx.fillRect(-1,-1,2,2);ctx.restore();
}
function aim(angle){
 const focus=profiles.Impacto.focus/100;
 if(!focus)return angle;
 const signed=Math.atan2(Math.sin(angle),Math.cos(angle));
 return signed*(1-.9*focus);
}
function scatter(ctx,kind,t,color,count){
 const random=generator(seed^0x519abe);
 for(let i=0;i<count;i++){
  const a=random(),b=random(),c=random(),d=random();
  let x,y,theta,length;
  if(kind==='Impacto'){
   theta=aim(a*Math.PI*2);const distance=(18+b*45+(80+c*103)*Math.sqrt(t))*profiles.Impacto.diameter/100;
   x=Math.cos(theta)*distance;y=Math.sin(theta)*distance+15*t*t*profiles.Impacto.diameter/100;
   length=3+d*11*(1-t);
  }else if(kind==='Corte'){
   x=-154+310*a+27*t;y=68-55*a-107*a*a+(b-.5)*(16+88*t);
   theta=-.35-.6*a+(c-.5)*.45;length=3+9*d;
  }else{
   const age=(a+t*1.25)%1;
   x=-50+110*t-12-age*(96+b*60);
   y=(c-.5)*(20+65*age)+Math.sin(age*5+b*6)*7;
   theta=(c-.5)*.45;length=(1-age)*(4+11*d);
  }
  ctx.save();ctx.translate(x,y);ctx.rotate(theta);
  ctx.fillStyle=!el('linkTint').checked ? el('particleTint').value : (i%4===0?'#fff7d7':color);
  const impact=kind==='Impacto';
  const width=(1.2+d)*(profiles[kind].particleWidth/100);
  const shape=i%profiles[kind].shapes;
  ctx.beginPath();
  const material=impact?el('material').value:'Energia';
  if(shape===0 && material==='Gosma')ctx.ellipse(0,0,width*2,width*1.65,0,0,Math.PI*2);
  else if(shape===0 && material==='Água')ctx.ellipse(0,0,length*.62,width,0,0,Math.PI*2);
  else if(shape===0 && material==='Fogo'){
   ctx.moveTo(-length,0);ctx.quadraticCurveTo(length*.1,-width*2,length*.7,-width);ctx.quadraticCurveTo(0,width*2,-length,0);
  }else switch(shape){
   case 1: ctx.ellipse(0,0,width*1.35,width,0,0,Math.PI*2); break;
   case 2: ctx.moveTo(-length*.6,width);ctx.lineTo(length,0);ctx.lineTo(-length*.2,-width*1.5);break;
   case 3: for(let k=0;k<8;k++){const angle=k*Math.PI/4;
    const radius=k%2===0?1:.25;
    const px=Math.cos(angle)*length*radius,py=Math.sin(angle)*width*2.8*radius;
    if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
   }break;
   default:ctx.moveTo(-length,0);ctx.lineTo(0,-width);ctx.lineTo(length*.55,0);ctx.lineTo(0,width);
  }
  ctx.closePath();ctx.fill();ctx.restore();
 }
}
function paint(ctx,base,mix,x,y,radius){
 ctx.fillStyle=base;
 if(mix===0){ctx.fill();return}
 const shadow=base.slice(1).match(/../g).map((pair,i)=>
  Math.round(parseInt(pair,16)*(1-mix*[.58,.66,.42][i])));
 const shade='rgb('+shadow.join(',')+')';
 const band=ctx.createLinearGradient(x-radius*.3,y-radius,x+radius*.3,y+radius);
 band.addColorStop(0,base);band.addColorStop(.56,base);
 band.addColorStop(.561,shade);band.addColorStop(1,shade);
 ctx.strokeStyle='rgba(35,17,45,'+mix*.88+')';
 ctx.lineWidth=1+3*mix;ctx.lineJoin='round';ctx.stroke();
 ctx.fillStyle=band;ctx.fill();
}
// Split the filled star into radial triangles, then move each piece from its own centroid.
function externalHeadings(count){
 const random=generator(seed^0x519abe);
 return Array.from({length:count},()=>{
  const angle=aim(random()*Math.PI*2);
  // scatter samples three more values per particle for its size and travel.
  random();random();random();
  return angle;
 });
}
function burstCore(points, progress, color, polygon, headings, inner=points.map(([x,y])=>[x*.66,y*.66])){
 const random=generator(seed^0x432db9);
 const count=Number(el('pieces').value);
 function edge(position,outline=points){
  const i=Math.floor(position),fraction=position-i;
  const a=outline[i%outline.length],b=outline[(i+1)%outline.length];
  return a.map((v,j)=>v+(b[j]-v)*fraction);
 }
 for(let i=0;i<count;i++){
   const start=i*points.length/count,end=(i+1)*points.length/count;
   const piece=[[0,0],edge(start)];
   for(let k=Math.floor(start)+1;k<end;k++)piece.push(points[k]);
   piece.push(edge(end));
   const inside=[[0,0],edge(start,inner),...inner.slice(Math.floor(start)+1,Math.ceil(end)),edge(end,inner)];
   const [mx,my]=edge((start+end)/2);
   const cx=mx*2/3,cy=my*2/3;
   const radial=Math.atan2(cy,cx);
   let direction=radial+(random()-.5)*.32;
   switch(el('openingShape').value){
    case 'cross': direction=Math.round(radial/(Math.PI/2))*Math.PI/2+(direction-radial); break;
    case 'fan': direction=.78*Math.sin(direction); break;
    case 'radial':
    case 'random': {
     direction=radial;
     let best=0;
     for(const angle of headings){
      const alignment=Math.cos(angle-radial);
      if(alignment>best){direction=angle;best=alignment}
     }
     break;
    }
    case 'spiral': direction+=progress*2.3; break;
   }
   const distance=progress*(62+random()*91)*profiles.Impacto.diameter/100;
   const size=(1-progress)**(1.4+random());
   const spin=progress*(random()-.5)*2.5;
   if(['radial','random'].includes(el('openingShape').value)){
    const ux=Math.cos(direction),uy=Math.sin(direction);
    // Keep the original vertices at release, then collapse their cross-track offsets.
    const lateral=size*Math.exp(-9*progress);
    function follow([px,py]){
     const along=(mx*ux+my*uy)*.66*(1-size)+distance+(px*ux+py*uy)*size;
     const across=(-px*uy+py*ux)*lateral;
     return [along*ux-across*uy,along*uy+across*ux];
    }
    polygon(piece.map(follow),color);
    polygon(inside.map(follow),elementsPalette[el('material').value][1]);
    continue;
   }
   const transform=([x,y])=>{
    const dx=(x-cx)*size,dy=(y-cy)*size;
    return [cx+distance*Math.cos(direction)+dx*Math.cos(spin)-dy*Math.sin(spin),
            cy+distance*Math.sin(direction)+dx*Math.sin(spin)+dy*Math.cos(spin)];
   };
   polygon(piece.map(transform),color);
   polygon(inside.map(transform),elementsPalette[el('material').value][1]);
 }
}
// Evaluate the gust in preview coordinates, then convert displacement back
// into each puff's local space (including mirrored and rotated plumes).
function bendSmoke(ctx,x,y,t){
 const force=+el('windForce').value/100;
 if(!force)return;
 const m=ctx.getTransform(),angle=+el('angle').value*Math.PI/180;
 const c=Math.cos(angle),s=Math.sin(angle);
 const a=c*m.a-s*m.b,b=s*m.a+c*m.b,d=s*m.c+c*m.d,h=c*m.c-s*m.d;
 const px=m.a*x+m.c*y+m.e-256,py=m.b*x+m.d*y+m.f-256;
 const dx=256+c*px-s*py-el('windX').value,dy=256+s*px+c*py-el('windY').value;
 const dir=+el('windAngle').value*Math.PI/180,u=Math.cos(dir),v=Math.sin(dir);
 const along=dx*u+dy*v,cross=-dx*v+dy*u;
 const width=+el('windWidth').value/2,reach=along<0?38:145;
 // Integrate exposure from the emitter to this puff. Past contact keeps
 // carrying the puff downwind even after its centre leaves the narrow jet.
 const pathX=a*x+h*y,pathY=b*x+d*y;
 let exposure=0;
 for(let i=0;i<16;i++){
  const back=(i+.5)/16;
  const sx=dx-back*pathX,sy=dy-back*pathY;
  const axial=sx*u+sy*v,lateral=-sx*v+sy*u;
  exposure+=Math.exp(-.5*((axial/(axial<0?38:145))**2+(lateral/width)**2))/16;
 }
 const local=Math.exp(-.5*((along/reach)**2+(cross/width)**2));
 const amount=force*(58*local+270*t*exposure);
 const det=a*d-b*h;
 const lx=(d*u-h*v)/det,ly=(a*v-b*u)/det;
 const gx=-amount*(along*u/(reach*reach)-cross*v/(width*width));
 const gy=-amount*(along*v/(reach*reach)+cross*u/(width*width));
 const localX=gx*a+gy*b,localY=gx*h+gy*d;
 ctx.translate(x+amount*lx,y+amount*ly);
 const limit=Math.min(1,.7/(Math.hypot(lx,ly)*Math.hypot(localX,localY)||1));

function impactPath(ctx,points,material,t){
 ctx.beginPath();
 if(material==='Gosma'||material==='Nanquim'){
  const last=points[points.length-1],first=points[0];
  ctx.moveTo((last[0]+first[0])/2,(last[1]+first[1])/2);
  points.forEach(([x,y],i)=>{
   const next=points[(i+1)%points.length];
   ctx.quadraticCurveTo(x,y,(x+next[0])/2,(y+next[1])/2);
  });
 }else{
  ctx.moveTo(...points[0]);
  for(let i=1;i<=points.length;i++){
   const [x,y]=points[i%points.length],[a,b]=points[i-1];
   const dx=x-a,dy=y-b;
   if(material==='Fogo'){
    const curl=.18+.08*Math.sin(t*7+i);
    ctx.bezierCurveTo(a+dx*.35-dy*curl,b+dy*.35+dx*curl,a+dx*.72+dy*.09,b+dy*.72-dx*.09,x,y);
   }else if(material==='Água'){
    ctx.quadraticCurveTo(a+dx*.55+dy*.16,b+dy*.55-dx*.16,x,y);
   }else ctx.lineTo(x,y);
  }
 }
 ctx.closePath();
}

  break;
 }
 case 'Gelo':
  polygon([[r-5,0],[r+5,-w*2],[r+28,-w],[r+16,w*1.6]],ink);
  polygon([[r+5,-w*2],[r+28,-w],[r+10,0]],highlight);break;
 case 'Vento':
  ctx.moveTo(r-12,-w*2);ctx.quadraticCurveTo(r+17,-w*4,r+28,0);
  ctx.quadraticCurveTo(r+17,-w*2,r-12,-w*2);ctx.fill();break;
 case 'Pedra':
  polygon([[r-4,0],[r+1,-w*2],[r+11,-w*1.5],[r+15,w],[r+6,w*2]],ink);break;
 case 'Nanquim':
  ctx.moveTo(r-15,0);ctx.quadraticCurveTo(r+4,-w*2,r+15,-w);
  ctx.quadraticCurveTo(r+25,w*2,r+9,w);ctx.closePath();ctx.fill();

 }

const pressureTint=document.createElement('canvas');
let pressureColor='';
function referenceAtlas(color){
 if(color===pressureColor)return pressureTint;
 pressureTint.width=pressureAtlas.naturalWidth;pressureTint.height=pressureAtlas.naturalHeight;
 const ink=pressureTint.getContext('2d');
 ink.drawImage(pressureAtlas,0,0);
 if(color!=='#b8e8fa'){
  const pixels=ink.getImageData(0,0,pressureTint.width,pressureTint.height);
  const rgb=parseInt(color.slice(1),16),channels=[rgb>>16,(rgb>>8)&255,rgb&255];
  for(let i=0;i<pixels.data.length;i+=4){
   if(!pixels.data[i+3])continue;
   const light=pixels.data[i]/255,brightness=pixels.data[i+1]/255;
   for(let k=0;k<3;k++)pixels.data[i+k]=brightness*(channels[k]+(255-channels[k])*light);
  }
  ink.putImageData(pixels,0,0);
 }
 pressureColor=color;return pressureTint;
}
const userRefs=new Map(),refRequests=new Map(),refErrors=new Map();
function refreshRef(){
 const kind=el('kind').value,item=userRefs.get(kind);
 el('refClear').hidden=!item;
 el('refStatus').textContent=refErrors.get(kind)||item?.name||'';
}
async function loadRef(kind,src,name){
 const token=Symbol();refRequests.set(kind,token);refErrors.delete(kind);
 if(!src){userRefs.delete(kind);refreshRef();preview();return}
 try{
  if(!/^(blob:|data:image\/(png|webp|jpeg);base64,)/.test(src))throw Error();
  const image=new Image();image.src=src;await image.decode();
  if(refRequests.get(kind)!==token)return;
  const scale=Math.min(1,512/Math.max(image.width,image.height));
  const sprite=document.createElement('canvas');sprite.width=Math.max(1,Math.round(image.width*scale));sprite.height=Math.max(1,Math.round(image.height*scale));
  sprite.getContext('2d').drawImage(image,0,0,sprite.width,sprite.height);
  userRefs.set(kind,{sprite,name,data:sprite.toDataURL('image/png')});
  if(kind==='Pressão de ar' && el('kind').value===kind){el('airEdge').value='spiked';refreshSmoke()}
 }catch{if(refRequests.get(kind)===token)refErrors.set(kind,'Não foi possível abrir a imagem.')}
 refreshRef();preview();
}
el('refUpload').onchange=async event=>{
 const file=event.target.files[0];if(!file)return;
 const url=URL.createObjectURL(file);event.target.value='';
 try{await loadRef(el('kind').value,url,file.name)}finally{URL.revokeObjectURL(url)}
};
el('refClear').onclick=()=>loadRef(el('kind').value,null);
function drawRefSprite(ctx,item,x,y,size){
 const image=item.sprite,scale=size/Math.max(image.width,image.height);
 ctx.drawImage(image,x-image.width*scale/2,y-image.height*scale/2,image.width*scale,image.height*scale);
}
function drawReferenceLayer(ctx,kind,t,profile){
 const item=userRefs.get(kind);if(!item||kind==='Pressão de ar')return;
 const progress=el('motion').value==='in'?1-t:t;
 let x=0,y=0;
 if(kind==='Projétil'||kind==='Corte')x=(progress-.5)*210;
 if(['Fogo','Água','Gosma','Fumaça'].includes(kind))y=54-110*t;
 ctx.save();ctx.globalAlpha=Math.min(1,t*9,(1-t)*5);
 drawRefSprite(ctx,item,x,y,(55+100*Math.sin(Math.PI*t))*profile.diameter/100);
 ctx.restore();
}
function drawAir(ctx,t,color,profile,strength){
 const tau=Math.PI*2,variant=el('drawing').selectedIndex;
 const waves=Number(el('airWaves').value),width=Number(el('airWidth').value);
 const flow=el('airFlow').value,random=generator(seed);
 ctx.scale(profile.diameter/100,profile.diameter/100*(variant===1?.34:1));
 ctx.shadowColor=color;ctx.shadowBlur=haloEnabled?profile.light*.15:0;
 const spacing=Number(el("airRingGap").value)/100;
 const interval=el("airInterval").value;
 const delayStep=interval==='auto'?.055*spacing:Number(interval)/(frames-1);
 const particleSpread=Number(el("airParticleGap").value)/100;
 for(let wave=0;wave<waves;wave++){
  const delay=wave*delayStep,age=(t-delay)/(1-(waves-1)*delayStep);
  const offset=random()*tau;
  if(age<=0 || age>=1)continue;
  const progress=flow==='in'?1-age:flow==='pulse'?Math.sin(Math.PI*age):age;
  const separation=interval==='auto'?0:wave*spacing*9;
  const radius=7+(125+strength*2+separation)*(1-(1-progress)**2)+separation*.35;
  ctx.globalAlpha=Math.min(1,age*10,(1-age)*6)*(.85-wave*.07);
  if(el('airEdge').value==='spiked'){
   const custom=userRefs.get('Pressão de ar');
   if(custom||pressureAtlas.naturalWidth){
    const breakup=Math.min(15,Math.max(0,Math.round((age-.46)/.54*15)));
    const atlas=custom?null:referenceAtlas(color),scale=87/239;
    const copies=Number(el('airCopies').value);
    for(let j=0;j<copies;j++){
     const fraction=j/copies;
     const angle=variant===2?(copies===1?0:-1.04+2.08*j/(copies-1)):offset+fraction*tau;
     const distance=radius*(variant===3?.4+.58*fraction:.76);
     const reach=radius/122;
     ctx.save();
     ctx.rotate(angle+(variant===3?progress*.65:0));
     ctx.translate(distance,0);
     ctx.rotate(.69);
     ctx.scale(reach,reach*(.8+.2*width/8));
     if(custom)drawRefSprite(ctx,custom,10,-13,87);
     else ctx.drawImage(atlas,(breakup%4)*320,Math.floor(breakup/4)*256,320,256,
      -30-8*scale,-49-60*scale,320*scale,256*scale);
     ctx.restore();
    }
   }
   continue;
  }
  const sections=variant===2?1:4;
  for(let j=0;j<sections;j++){
   const start=variant===2?-1.04:offset+j*tau/sections;
   const span=variant===2?2.08:tau/sections*.93;
   const points=36;
   ctx.beginPath();
   for(let edge=0;edge<2;edge++){
    for(let k=0;k<=points;k++){
     const u=edge?1-k/points:k/points,along=(j+u)/sections;
     const a=start+u*span+(variant===3?progress*.65:0);
     const r=radius*(variant===3?.42+.58*along:1)+Math.sin(a*3+offset)*radius*.018
       -edge*Math.min(radius*.45,width)*Math.sin(Math.PI*u);
     const x=Math.cos(a)*r,y=Math.sin(a)*r;
     if(!edge&&!k)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
   }
   ctx.closePath();ctx.fillStyle=color;ctx.fill();
  }
 }
 const progress=flow==='in'?1-t:flow==='pulse'?Math.sin(Math.PI*t):t;
 ctx.globalAlpha=Math.sin(Math.PI*t)*.65;
 for(let i=0;i<profile.particles;i++){
  const a=variant===2?(random()-.5)*2:random()*tau;
  const r=(8+(125+strength*2)*(1-(1-progress)**2))*(1+particleSpread*(random()*.35-.3));
  materialParticle(ctx,i,r*Math.cos(a),r*Math.sin(a),2+random()*6,1,a,color);
 }
}
function drawFocus(ctx,t,color,profile,strength){
 const random=generator(seed),count=+el('beams').value,width=+el('beamWidth').value;
 const variant=el('drawing').selectedIndex;
 const pulse=Math.sin(Math.PI*t),level=Math.min(1,t*8)*Math.min(1,(1-t)*6);
 ctx.globalAlpha=level;ctx.globalCompositeOperation='lighter';
 const rays=[];
 for(let i=0;i<count;i++){
  const fraction=(i+.5)/count,jitter=(random()-.5)*.22;
  let a=fraction*2*Math.PI+jitter;
  if(variant===1)a=-Math.PI/2+(fraction-.5)*1.8+jitter;
  if(variant===2)a=(i%2)*Math.PI+jitter+(fraction-.5)*.5;
  if(variant===3)a=(fraction-.5)*1.45+jitter;
  const length=(115+random()*95)*profile.diameter/100;
  const w=width*(.6+.7*random()),front=length*Math.max(0,1-t*(3+random()));
  rays.push([a,length]);
  ctx.save();ctx.rotate(a);
  const gradient=ctx.createLinearGradient(0,0,length,0);
  gradient.addColorStop(0,'#fff7de');gradient.addColorStop(.25,color+'ae');gradient.addColorStop(1,color+'00');
  ctx.fillStyle=gradient;ctx.beginPath();ctx.moveTo(front,-1-front*w/length);
  ctx.lineTo(length,-w);ctx.lineTo(length,w);ctx.lineTo(front,1+front*w/length);ctx.closePath();ctx.fill();ctx.restore();
 }
 for(let i=0;i<profile.particles;i++){
  const [a,len]=rays[i%count],r=(1-(random()+t*1.45)%1)*len;
  ctx.save();ctx.rotate(a);ctx.fillStyle=color;ctx.fillRect(r,-1,2+random()*6,1.6);ctx.restore();
 }
 const charge=Math.min(1,t*3)*(.6+.4*pulse),core=(2+strength*.55)*charge;
 if(core>0){
  const radius=core+profile.light*.55;
  const halo=ctx.createRadialGradient(0,0,0,0,0,radius);
  halo.addColorStop(0,'#ffffff');halo.addColorStop(.2,color+'cf');halo.addColorStop(1,color+'00');
  ctx.fillStyle=halo;ctx.fillRect(-radius,-radius,2*radius,2*radius);
  ctx.fillStyle='#fffbe9';ctx.beginPath();ctx.arc(0,0,core,0,2*Math.PI);ctx.fill();
 }
}
function draw(ctx,index,local=false){
 drawBase(ctx,index,local);
 const kind=el('kind').value;
 if(local||!userRefs.has(kind)||kind==='Pressão de ar')return;
 ctx.save();ctx.beginPath();ctx.rect(0,0,512,512);ctx.clip();
 ctx.translate(kind==='Ponto de luz'?+el('focusX').value:256,kind==='Ponto de luz'?+el('focusY').value:256);
 ctx.rotate(+el('angle').value*Math.PI/180);drawReferenceLayer(ctx,kind,index/(frames-1),profiles[kind]);ctx.restore();

  if(Array.isArray(data))sessionTypes=data;
 }catch{}
 return sessionTypes;
}
function persistTypes(types){
 sessionTypes=types;
 try{localStorage.setItem(presetKey,JSON.stringify(types));sessionOnly=false}catch{sessionOnly=true}
}
function downloadTypes(types){
 const blob=new Blob([JSON.stringify({format:'sokonfx-types-v1',types},null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download='SokonFX-tipos.json';link.click();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}
el('backup').onclick=()=>{
 const types=storedTypes();
 if(types.length)downloadTypes(types);
 else el('presetStatus').textContent='Nenhum tipo salvo nesta cópia.';
};
el('restore').onchange=async()=>{
 const file=el('restore').files[0];
 if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  const incoming=Array.isArray(data)?data:data.types;
  if(!Array.isArray(incoming)||!incoming.every(p=>typeof p?.name==='string'&&p.name.trim()&&Object.hasOwn(profiles,p.values?.kind)&&Number.isInteger(p.seed)))throw Error();
  const merged=storedTypes().slice();
  for(const item of incoming){
   if(merged.some(p=>JSON.stringify(p)===JSON.stringify(item)))continue;
   let name=item.name,n=2;
   while(merged.some(p=>p.name===name))name=item.name+' ('+(n++)+')';
   merged.push({...item,name});
  }
  persistTypes(merged);showTypes(merged);
  el('presetStatus').textContent='Importação concluída. Escolha um tipo salvo.';
 }catch{el('presetStatus').textContent='Arquivo de tipos inválido.'}
 el('restore').value='';
};
function showTypes(types){
 const select=el('savedTypes');
 select.length=1;
 for(const type of types)select.add(new Option(type.name,type.name));
}
try{showTypes(storedTypes())}catch{el('presetStatus').textContent='Não foi possível acessar os tipos salvos neste navegador.'}
el('keep').onclick=()=>{
 const name=el('presetName').value.trim();
 if(!name){el('presetStatus').textContent='Digite um nome para salvar.';el('presetName').focus();return}
 try{
  const types=storedTypes();
  const index=types.findIndex(type=>type.name===name);
  if(index>=0 && !confirm('Substituir o tipo “'+name+'”?'))return;
  const values=Object.fromEntries(savedFields.map(id=>[id,el(id).value]));
  const ref=userRefs.get(values.kind);
  const preset={name,values,reference:ref?{name:ref.name,data:ref.data}:null,seed,haloEnabled,customParticleTint,linked:el('linkTint').checked};
  if(index>=0)types[index]=preset;else types.push(preset);
  persistTypes(types);downloadTypes(types);
  showTypes(types);
  el('savedTypes').value='';
  el('presetStatus').textContent='Tipo salvo. Guarde o JSON para importar na próxima versão.';
 }catch{el('presetStatus').textContent='Falha ao salvar. Verifique o armazenamento do navegador.'}
};
el('savedTypes').onchange=()=>{
 try{
  const preset=storedTypes().find(type=>type.name===el('savedTypes').value);
  if(!preset)return;
  for(const id of savedFields)el(id).value=preset.values[id]??(id==='airCopies'&&preset.values.drawing==='saw'?'4':undefined)??(id==='tipGap'?preset.values.gap:undefined)??smokeDefaults[id]??(['rimWidth','coreWidth','diameter'].includes(id)?100:id==='focus'?0:id==='drawing'?'star':id==='artStyle'?'original':id==='material'?'Energia':el(id).value);
  if(preset.values.kind==='Fumaça' && preset.values.plumes===undefined){
   const wasDouble=preset.values.drawing==='twin';
   el('plumes').value=wasDouble?2:1;
   if(wasDouble)el('drawing').selectedIndex=0;
  }
  refreshSmoke();
  const profile=profiles[el('kind').value];
  for(const id of ['styleMix','particles','light'])profile[id]=+el(id).value;
  for(const id of ['rimWidth','coreWidth','diameter','focus','riskWidth','outerWidth','particleWidth','shapes']){
   profile[id]=+el(id).value;
   el(id+'Value').value=el(id).value+(id==='shapes'?'':'%');
  }
  seed=preset.seed;customParticleTint=preset.customParticleTint;
  el('linkTint').checked=preset.linked;
  if(haloEnabled!==preset.haloEnabled)el('halo').onclick();
  el('pieceValue').value=el('pieces').value;el('openingValue').value=el('openingFrame').value;
  el('presetName').value=preset.name;
  el('frame').value=0;start=performance.now();
  el('kind').oninput();
  loadRef(preset.values.kind,preset.reference?.data,preset.reference?.name);
  el('presetStatus').textContent='Tipo carregado: '+preset.name;
  el('savedTypes').value='';
 }catch{el('presetStatus').textContent='Não foi possível carregar este tipo.'}
};
el('smokeForm').value='jump';
el('plumes').value='1';
el('kind').value='Fumaça';
el('kind').dispatchEvent(new Event('input'));
requestAnimationFrame(tick)
</script></html>
